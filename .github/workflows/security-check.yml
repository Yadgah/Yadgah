name: Security Check

on:
  schedule:
    - cron: '0 0 * * 0' # Runs weekly
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      # `safety check` was removed here: the Safety CLI now needs an
      # account/API key, so the dependency audit is done with the
      # free and open-source pip-audit instead (issue #202).
      - name: Run security checks
        run: |
          bandit -r . -x ./venv,./staticfiles
          pip-audit
