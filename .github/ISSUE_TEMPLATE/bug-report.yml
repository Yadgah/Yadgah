name: 🐛 Bug Report | گزارش باگ
description: Report something that is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! 🙏
        ممنون که برای گزارش باگ وقت می‌ذارید. هرچه توضیح کامل‌تر باشه، سریع‌تر حل می‌شه.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug | شرح باگ
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce | مراحل بازتولید
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior | رفتار مورد انتظار
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior | رفتار فعلی
      description: What actually happened? Include error messages / tracebacks if any.
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots | اسکرین‌شات
      description: If applicable, add screenshots to help explain the problem.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Affected area | بخش درگیر
      options:
        - Front-end (templates/UI)
        - Back-end (Django)
        - Database
        - AI
        - Config / CI
        - Not sure
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment | محیط اجرا
      description: Browser, OS, Python/Django versions -- anything that might help.
      placeholder: |
        - OS: e.g. Ubuntu 24.04 / Windows 11
        - Browser: e.g. Firefox 130
        - Python: e.g. 3.12
    validations:
      required: false
